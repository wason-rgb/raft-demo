name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 6.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install Android command-line tools
        env:
          ANDROID_SDK_ROOT: ${{ runner.workspace }}/android-sdk
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "HOME=$HOME"
          echo "=== 下载 cmdline-tools ==="
          curl -fsSL --retry 3 --retry-delay 5 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/
          ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/ | head -10
          echo "=== cmdline-tools 装好 ==="

      - name: Accept Android SDK licenses
        env:
          ANDROID_SDK_ROOT: ${{ runner.workspace }}/android-sdk
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -e
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which java
          java -version
          echo "=== 接受 SDK licenses ==="
          yes | sdkmanager --licenses
          echo "=== licenses 接受完成 ==="

      - name: Install Android SDK platform + build-tools (no NDK)
        env:
          ANDROID_SDK_ROOT: ${{ runner.workspace }}/android-sdk
        run: |
          set -e
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          echo "=== 装 platform-tools + platforms;android-34 + build-tools;34.0.0 ==="
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "=== 小包装完 ==="

      - name: Install Android NDK 26.1.10909125
        env:
          ANDROID_SDK_ROOT: ${{ runner.workspace }}/android-sdk
        run: |
          set -e
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          echo "=== 装 NDK 26.1.10909125（约 1GB，1-2 分钟）==="
          sdkmanager "ndk;26.1.10909125"
          echo "=== NDK 装完 ==="
          ls $ANDROID_SDK_ROOT/ndk/26.1.10909125/source.properties 2>&1 | head -3

      - name: Download Godot 4.2.2 Mono Editor
        run: |
          set -e
          echo "=== 下 Godot 4.2.2 Mono Editor ==="
          curl -fsSL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_mono_linux_x86_64.zip -o godot-mono.zip
          unzip -q -o godot-mono.zip -d /opt
          ls -la /opt/Godot_v4.2.2-stable_mono_linux_x86_64/ | head -5
          ln -sf /opt/Godot_v4.2.2-stable_mono_linux_x86_64/Godot_v4.2.2-stable_mono_linux.x86_64 /usr/local/bin/godot-mono
          chmod +x /opt/Godot_v4.2.2-stable_mono_linux_x86_64/Godot_v4.2.2-stable_mono_linux.x86_64
          godot-mono --version
          rm -f godot-mono.zip

      - name: Setup Godot Android Export Templates
        run: |
          set -e
          echo "=== 下 Godot 4.2.2 mono export templates ==="
          curl -fsSL --retry 3 --retry-delay 10 https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_mono_export_templates.tpz -o templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable.mono/
          unzip -q templates.tpz -d /tmp/templates/
          cp /tmp/templates/templates/android_* ~/.local/share/godot/export_templates/4.2.2.stable.mono/
          ls -la ~/.local/share/godot/export_templates/4.2.2.stable.mono/

      - name: Install Android Build Template
        run: |
          set -e
          echo "=== 检查 android/build/build.gradle 存在性 ==="
          if [ ! -f android/build/build.gradle ]; then
            echo "=== 解压 android_source.zip 到 android/build/ (Godot 期望 res://android/build/build.gradle) ==="
            mkdir -p android/build
            unzip -q ~/.local/share/godot/export_templates/4.2.2.stable.mono/android_source.zip -d android/build/
            echo "--- android/build/ 顶层 ---"
            ls -la android/build/ | head -15
            if [ -f android/build/build.gradle ]; then
              echo "OK android/build/build.gradle 已就位"
            else
              echo "FAIL build.gradle 缺失！"
              find android/ -name "build.gradle" 2>/dev/null
              exit 1
            fi
          else
            echo "=== android/build/build.gradle 已存在，跳过 ==="
            ls -la android/build/ | head -15
          fi

      - name: Generate Android debug keystore
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.workspace }}/.config/godot/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -e
          echo "=== 生成 debug keystore ==="
          mkdir -p $(dirname "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH")
          if [ ! -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" ]; then
            $JAVA_HOME/bin/keytool -genkey -v -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
                    -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" -keyalg RSA -keysize 2048 -validity 10000 \
                    -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" -keypass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
                    -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" ]; then
            echo "FAIL keystore 生成失败"
            exit 1
          fi
          echo "OK keystore 已就位"
          ls -la "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$GODOT_ANDROID_KEYSTORE_DEBUG_USER"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD"

      - name: Build Android APK
        env:
          ANDROID_SDK_ROOT: ${{ runner.workspace }}/android-sdk
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -e
          echo "=== Import project (first-time setup, ~30s) ==="
          godot-mono --headless --import 2>&1 | tee /tmp/import.log
          echo "godot import exit=${PIPESTATUS[0]}"
          echo "--- import.log 末尾 20 行 ---"
          tail -20 /tmp/import.log
          echo "=== Build APK ==="
          mkdir -p build
          godot-mono --headless --export-debug "Android" build/raft-demo.apk 2>&1 | tee /tmp/export.log
          echo "godot export exit=${PIPESTATUS[0]}"
          echo "--- export.log 末尾 40 行 ---"
          tail -40 /tmp/export.log
          ls -la build/
          if [ ! -f build/*.apk ]; then
            echo "FAIL APK 未生成"
            exit 1
          fi
          echo "OK APK 已生成"

      - name: Upload to Pgyer (蒲公英)
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        run: |
          set -e
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then echo "No APK"; exit 1; fi
          echo "Found APK: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"
          pip install --quiet requests
          python tools/pgyer_upload.py --file "$APK_PATH" --api-key "$PGYER_API_KEY" --build-name "raft-demo-${{ github.sha }}" --build-desc "Commit: ${{ github.sha }}"

      - name: Upload Godot build logs (诊断用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-build-logs
          path: |
            /tmp/import.log
            /tmp/export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raft-demo-apk
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30
