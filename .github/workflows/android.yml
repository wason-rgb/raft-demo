name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build + Upload to Pgyer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        env:
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          echo "=== Install Android command-line tools ==="
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3          

      - name: Download Godot 4.2.2 Mono Editor
        run: |
          echo "=== Download Godot Mono editor (~53MB) ==="
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_mono_linux_x86_64.zip
          unzip -q Godot_v4.2.2-stable_mono_linux_x86_64.zip
          mv Godot_v4.2.2-stable_mono_linux.x86_64 /usr/local/bin/godot-mono
          chmod +x /usr/local/bin/godot-mono
          godot-mono --version          

      - name: Setup Godot Android Export Templates
        run: |
          echo "=== Download Mono Android export templates (~820MB) ==="
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_mono_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable.mono/
          unzip -q Godot_v4.2.2-stable_mono_export_templates.tpz -d /tmp/templates/
          cp /tmp/templates/templates/android_* ~/.local/share/godot/export_templates/4.2.2.stable.mono/
          ls -la ~/.local/share/godot/export_templates/4.2.2.stable.mono/          

      - name: Build Android APK
        env:
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          echo "=== Import project ==="
          godot-mono --headless --import 2>&1 | tail -20
          echo "=== Build APK ==="
          mkdir -p build
          godot-mono --headless --export-debug "Android" build/raft-demo.apk 2>&1 | tail -30
          ls -la build/          

      - name: Upload to Pgyer
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then echo "❌ No APK"; exit 1; fi
          echo "✅ APK: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"
          pip install --quiet requests
          python tools/pgyer_upload.py --file "$APK_PATH" --api-key "$PGYER_API_KEY" --build-name "raft-demo-${{ github.sha }}" --build-desc "Commit: ${{ github.sha }}"          

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raft-demo-apk
          path: build/*.apk
          if-no-files-found: ignore
          retention-days: 30