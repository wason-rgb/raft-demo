name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: false
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build + Upload to Pgyer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Godot export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates/
            /root/.local/share/godot/export_templates/
          key: godot4.2.2-stable-mono-android-template
          restore-keys: |
            godot4.2.2-stable-mono-android-template-

      - name: Build Android APK
        id: build
        uses: barichello/godot-ci@v3.0.2
        with:
          version: 4.2.2
          use_mono: true
          godot_executable: godot-mono
          export: "Android"
          export_debug: false
          packaging: false
          include_addons: false
          android_build_template: true
          cache: ${{ steps.cache-templates.outputs.cache-hit != 'true' }}
        env:
          ANDROID_SDK_ROOT: /opt/android-sdk

      - name: Verify APK
        if: always()
        run: |
          echo "Build result: ${{ steps.build.outcome }}"
          ls -la build/ || echo "No build dir"
          find . -name "*.apk" 2>/dev/null

      - name: Find APK
        id: find_apk
        if: success()
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Setup Python
        if: success()
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: success()
        run: pip install requests

      - name: Upload to Pgyer (蒲公英)
        if: success()
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        run: |
          python tools/pgyer_upload.py \
            --file "${{ steps.find_apk.outputs.apk_path }}" \
            --api-key "$PGYER_API_KEY" \
            --build-name "raft-demo-${{ github.sha }}" \
            --build-desc "Commit: ${{ github.sha }} | Author: ${{ github.actor }} | Branch: ${{ github.ref_name }}"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raft-demo-apk
          path: build/*.apk
          if-no-files-found: ignore
          retention-days: 30
