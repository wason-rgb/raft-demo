name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 6.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '10406996'
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools            

      - name: Download Godot 4.2.2 Mono Editor
        run: |
          curl -fsSL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_mono_linux_x86_64.zip -o godot-mono.zip
          unzip -q godot-mono.zip -d /opt/godot-mono/
          # mv 实际目录名
          cd /opt/godot-mono && ls
          cd /opt/godot-mono/*/ && mv * /opt/godot-mono/ 2>/dev/null || true
          cd /opt && ls godot-mono/
          ln -sf /opt/godot-mono/Godot_v4.2.2-stable_mono_linux.x86_64 /usr/local/bin/godot-mono
          godot-mono --version          

      - name: Setup Godot Android Export Templates
        run: |
          curl -fsSL --retry 3 --retry-delay 10 https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_mono_export_templates.tpz -o templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable.mono/
          unzip -q templates.tpz -d /tmp/templates/
          cp /tmp/templates/templates/android_* ~/.local/share/godot/export_templates/4.2.2.stable.mono/
          ls -la ~/.local/share/godot/export_templates/4.2.2.stable.mono/          

      - name: Install Android Build Template
        run: |
          set -e
          if [ ! -f android/build/build.gradle ]; then
            echo "=== Installing Android Build Template from export_templates ==="
            mkdir -p android/build
            unzip -q ~/.local/share/godot/export_templates/4.2.2.stable.mono/android_source.zip -d android/build/
            ls -la android/build/ | head -15
          else
            echo "=== Android build template already installed ==="
          fi          

      - name: Generate Android debug keystore
        run: |
          set -e
          mkdir -p ~/.config/godot
          if [ ! -f ~/.config/godot/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.config/godot/debug.keystore \
                    -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                    -storepass android -keypass android \
                    -dname "CN=Android Debug,O=Android,C=US" 2>&1 | tail -3
          fi
          echo "=== Keystore ready ==="
          ls -la ~/.config/godot/debug.keystore
          # 关键：把 keystore 信息注入后续 step 的 ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.config/godot/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"              >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"                  >> "$GITHUB_ENV"          

      - name: Build Android APK
        env:
          ANDROID_SDK_ROOT: ${{ steps.setup-android-sdk.outputs.android-sdk-root }}
        run: |
          set -e
          echo "=== Import project (first-time setup, ~30s) ==="
          godot-mono --headless --import 2>&1 | tee /tmp/import.log | tail -20
          echo "godot import exit=${PIPESTATUS[0]}"
          echo "=== Build APK ==="
          mkdir -p build
          godot-mono --headless --export-debug "Android" build/raft-demo.apk 2>&1 | tee /tmp/export.log | tail -40
          echo "godot export exit=${PIPESTATUS[0]}"
          echo "=== build/ 目录内容 ==="
          ls -la build/
          if [ ! -f build/*.apk ]; then echo "APK 未生成"; exit 1; fi          

      - name: Upload to Pgyer (蒲公英)
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then echo "No APK"; exit 1; fi
          echo "Found APK: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"
          pip install --quiet requests
          python tools/pgyer_upload.py --file "$APK_PATH" --api-key "$PGYER_API_KEY" --build-name "raft-demo-${{ github.sha }}" --build-desc "Commit: ${{ github.sha }}"          

      - name: Upload Godot build logs (诊断用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-build-logs
          path: |
            /tmp/import.log
            /tmp/export.log            
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raft-demo-apk
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30
